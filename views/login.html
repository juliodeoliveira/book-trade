<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Trade</title>
    <style>
        body {
            background-color: #E5D2B4;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }

        .register-link a {
            color: #333;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Login</h1>
        {{if .Errors}}
            <ul style="color: red;">
                <li>{{.Errors}}</li>
            </ul>
        {{end}}
        
        <form action="/user/login" method="post">
            <div>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="seuemail@email.com" required>
            </div>

            <div>
                <label for="password">Senha:</label>
                <input type="password" name="password" id="password" placeholder="Sua senha" required>
            </div>

            <input type="submit" value="Entrar">
        </form>

        <div class="register-link">
            <p>Não tem uma conta? <a href="/user/register">Cadastre-se</a></p>
        </div>
    </div>

</body>
</html>
