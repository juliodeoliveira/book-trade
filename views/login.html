<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Trade</title>

    {{range .CSSFiles}}
        <link rel="stylesheet" href="{{.}}">
    {{end}}
    
</head>
<body>

    <div class="form-container">
        <h1>Login</h1>
        {{if .Errors}}
            <ul style="color: red;">
                <li>{{.Errors}}</li>
            </ul>
        {{end}}
        
        <form action="/user/login" method="post">
            <div>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="seuemail@email.com" required>
            </div>

            <div>
                <label for="password">Senha:</label>
                <input type="password" name="password" id="password" placeholder="Sua senha" required>
            </div>

            <input type="submit" value="Entrar">
        </form>

        <div class="alter-link">
            <p>Não tem uma conta? <a href="/user/register">Cadastre-se</a></p>
        </div>
    </div>

</body>
</html>
